# Device profile: Google Pixel Fold (felix)
# Tensor G2 / GS201

NAME="Google Pixel Fold (felix)"
KIND=phone
SOC="Google Tensor G2 (GS201)"

# --- boot chain (phones) ---------------------------------------------------------------------------
UEFI_TARGET=felix
UEFI_FD=
DTB="felix.dtb"
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0xFC000000
WIFI_ATH11K=0

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="-v debug=0x8 cpus=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
